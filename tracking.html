<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracking Pengiriman SITTA</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="tracking">
    <div class="container">
      <div class="header-row">
        <div>
          <div class="site-brand">
            <span class="brand-mark">UT</span>
            <span>Tracking Pengiriman</span>
          </div>
          <h1 class="page-title" id="greeting">Pantau status Delivery Order</h1>
          <p class="subtitle">
            Masukkan nomor DO untuk melihat nama mahasiswa, status pengiriman,
            detail ekspedisi, dan riwayat perjalanan.
          </p>
        </div>
        <div>
          <a href="dashboard.html" class="btn btn-secondary"
            >Kembali ke Dashboard</a
          >
        </div>
      </div>

      <div class="page-card" style="margin-top: 20px">
        <div class="panel">
          <form
            id="tracking-form"
            class="grid-2"
            style="align-items: end; gap: 18px"
          >
            <div class="input-group">
              <label for="do-number">Nomor Delivery Order</label>
              <input
                id="do-number"
                type="text"
                placeholder="Contoh: 2023001234"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary">Cari</button>
          </form>
        </div>
      </div>

      <div id="tracking-details" style="margin-top: 22px"></div>
    </div>

    <footer>
      Halaman tracking ini menunjukkan simulasi detail pengiriman berdasarkan
      data dummy yang tersedia.
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
